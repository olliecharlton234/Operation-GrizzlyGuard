# Parameters for bear_yolo_node (RGB YOLO bear detection).
/**:
  ros__parameters:
    # Absolute path, or a file name inside this package's models/ folder.
    model_path: "yolo26n.onnx"
    # Relative to the node namespace: parrot1 namespace -> /parrot1/camera/image
    image_topic: "camera/image"

    # Target class is resolved by NAME from the model's class list (COCO "bear" = 21,
    # a custom single-class model will have bear = 0). Set target_class_id >= 0 to force an id.
    target_class: "bear"
    target_class_id: -1
    # Class names come from the ONNX export's metadata. Only if a model lacks them, add:
    # class_names: ["bear"]          (list index = class id)

    confidence_threshold: 0.25
    iou_threshold: 0.45        # used only for raw (non-end2end) exports
    inference_size: 640        # must match the exported model's input size
    output_format: "auto"      # auto | raw | end2end

    # Camera publishes at 3 Hz; frames arriving faster than this are skipped, never queued.
    process_rate_hz: 3.0
    max_frame_age_s: 1.0       # never process a frame that has waited longer than this

    execution_provider: "cpu"  # cpu | cuda (cuda needs the GPU ONNX Runtime build; falls back to cpu)
    intra_op_threads: 2

    publish_annotated: true        # /<ns>/bear_detections/image, only rendered while subscribed
    annotate_other_classes: false  # true = also draw non-bear classes in grey (debugging)